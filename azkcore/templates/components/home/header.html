<!-- ============ TOPBAR ============ -->
    <header class="h-16 shrink-0 flex items-center justify-between gap-4 px-4 sm:px-6 border-b border-hairline bg-ink/95 backdrop-blur">

      <div class="flex items-center gap-4 min-w-0">
        <button class="md:hidden text-mist">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
        <h1 class="text-[15px] font-display font-semibold tracking-tight truncate">{{ subtitle }}</h1>
        <span class="hidden lg:inline-block h-4 w-px bg-hairline"></span>
        <p class="hidden lg:block text-xs text-mist truncate">{{ description }}</p>
      </div>

      <!-- Search -->
      <div class="hidden sm:flex flex-1 max-w-md">
        <div class="relative w-full">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 text-mist pointer-events-none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Buscar módulos, escaneos, reportes…"
            class="w-full bg-surface2 border border-hairline rounded-lg pl-9 pr-3.5 py-2 text-sm text-paper placeholder:text-mist/70 focus:outline-none focus:ring-1 focus:ring-accent/60 focus:border-accent/60 transition-colors duration-200" />
        </div>
      </div>

      <!-- Right actions -->
      <div class="flex items-center gap-3 shrink-0">
        <button class="relative w-9 h-9 flex items-center justify-center rounded-lg text-mist hover:text-paper hover:bg-white/[0.05] transition-colors duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="absolute top-1.5 right-1.5 h-1.5 w-1.5 rounded-full bg-[#EF4444]"></span>
        </button>

        <span class="h-6 w-px bg-hairline"></span>

        <button class="flex items-center gap-2.5 pl-1 pr-2.5 py-1 rounded-lg hover:bg-white/[0.05] transition-colors duration-200">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-deepblue to-accent flex items-center justify-center text-xs font-semibold">
            AR
          </div>
          <div class="hidden lg:flex flex-col items-start leading-tight">
            <span class="text-xs font-medium text-paper">{{ user.first_name }} {{ user.last_name }}</span>
            <span class="text-[11px] text-mist">{{ user.username }}</span>
          </div>
        </button>
        <form method="POST" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="flex items-center gap-2 bg-[#EF4444] hover:bg-[#EF4444]/90 rounded-lg px-3.5 py-2 text-sm font-medium text-white transition-colors duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Cerrar sesión
          </button>
        </form>
      </div>
    </header>
